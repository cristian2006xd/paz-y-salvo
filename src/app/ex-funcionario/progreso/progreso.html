<div class="page">
  <header class="header">
    <div>
      <h1>Progreso de Solicitud</h1>
      <p>Estado actualizado de cada área participante.</p>
    </div>
  </header>

  <section class="card" *ngIf="cargando">
    Cargando progreso...
  </section>

  <section class="error-card" *ngIf="!cargando && error">
    {{ error }}
  </section>

  <section class="card" *ngIf="!cargando && !error">
    <div class="summary">
      <div>
        <span>Solicitud</span>
        <h2>#{{ solicitud?.id }}</h2>
      </div>

      <div>
        <span>Estado</span>
        <h2>{{ solicitud?.estado }}</h2>
      </div>

      <div>
        <span>Avance</span>
        <h2>{{ porcentaje() }}%</h2>
      </div>
    </div>

    <div class="bar">
      <div class="fill" [style.width.%]="porcentaje()"></div>
    </div>

    <div class="areas-grid">
      <article class="area" *ngFor="let a of areas" [class.ok]="a.estado === 'COMPLETADO'">
        <h3>{{ a.area }}</h3>
        <strong>{{ a.estado }}</strong>
        <p>{{ a.comentario || 'Pendiente de validación.' }}</p>
      </article>
    </div>
  </section>
</div>
