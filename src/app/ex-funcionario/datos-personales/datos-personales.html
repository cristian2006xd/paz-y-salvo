<div class="page">

  <header class="header">
    <div>
      <h1>Datos Personales</h1>
      <p>Complete la información requerida para el proceso de paz y salvo.</p>
    </div>
  </header>

  <section class="card">
    <h2>Información del ex funcionario</h2>

    <div class="form-grid">
      <div class="field">
        <label>Cédula</label>
        <input [(ngModel)]="datos.cedula" placeholder="Ingrese su cédula">
      </div>

      <div class="field">
        <label>Teléfono</label>
        <input [(ngModel)]="datos.telefono" placeholder="Ingrese su teléfono">
      </div>

      <div class="field">
        <label>Correo personal</label>
        <input [(ngModel)]="datos.correo" placeholder="correo@ejemplo.com">
      </div>

      <div class="field">
        <label>Dirección</label>
        <input [(ngModel)]="datos.direccion" placeholder="Ingrese su dirección">
      </div>

      <div class="field">
        <label>Cargo</label>
        <input [(ngModel)]="datos.cargo" placeholder="Cargo que desempeñaba">
      </div>

      <div class="field">
        <label>Unidad / Área</label>
        <input [(ngModel)]="datos.unidad" placeholder="Unidad o área">
      </div>
    </div>

    <div class="actions">
      <button (click)="guardar()">
        Guardar datos
      </button>
    </div>

    <p class="success" *ngIf="mensaje">{{ mensaje }}</p>
    <p class="error" *ngIf="error">{{ error }}</p>
  </section>

</div>
