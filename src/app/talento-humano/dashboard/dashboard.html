<div class="page">

  <header class="header">
    <h1>Panel Talento Humano</h1>
    <p>Gestión general del proceso de paz y salvo.</p>
  </header>

  <section class="grid">

    <div class="card total">
      <h2>{{ stats.total }}</h2>
      <span>Total solicitudes</span>
    </div>

    <div class="card pendiente">
      <h2>{{ stats.pendientes }}</h2>
      <span>Pendientes</span>
    </div>

    <div class="card proceso">
      <h2>{{ stats.proceso }}</h2>
      <span>En proceso</span>
    </div>

    <div class="card aprobado">
      <h2>{{ stats.aprobadas }}</h2>
      <span>Aprobadas</span>
    </div>

  </section>

</div>
